name: Validar TP

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp_ci
          POSTGRES_DB: libreria_test
          # Servicio efímero del runner, accesible únicamente en loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U tp_ci -d libreria_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://tp_ci@127.0.0.1:5432/libreria
      TEST_DATABASE_URL: postgresql+asyncpg://tp_ci@127.0.0.1:5432/libreria_test
      SQL_ECHO: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Preparar base de demostración
        run: psql -h 127.0.0.1 -U tp_ci -d postgres -c 'CREATE DATABASE libreria'
      - name: Migrar desde cero y comprobar reversibilidad
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Cargar datos de forma repetible
        run: |
          python -m scripts.seed
          python -m scripts.seed
      - name: Revisar estilo
        run: python -m ruff check .
      - name: Ejecutar pruebas con PostgreSQL real
        run: python -m pytest -q
